<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230" fill="none">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1124"/>
      <stop offset="50%" stop-color="#0E1B38"/>
      <stop offset="100%" stop-color="#070C1A"/>
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="techBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    .section-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #34D399;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .cat-label {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #38BDF8;
      letter-spacing: 0.5px;
    }
    .skill-pill {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #E2E8F0;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="836" height="226" rx="16" fill="url(#techBg)" stroke="url(#techBorder)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(36, 28)">
    <circle cx="8" cy="8" r="8" fill="#10B981" fill-opacity="0.2"/>
    <path d="M 5 8 L 11 8 M 8 5 L 8 11" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <text class="section-title" x="24" y="12">TECHNICAL TOOLKIT &amp; PROFICIENCIES</text>
  </g>

  <!-- Row 1: Languages & Problem Solving -->
  <g transform="translate(36, 62)">
    <text class="cat-label" x="0" y="20">CORE LANGUAGES</text>
    
    <g transform="translate(160, 0)">
      <!-- C++ -->
      <g transform="translate(0, 0)">
        <rect width="120" height="30" rx="8" fill="#132342" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
        <text class="skill-pill" x="60" y="19" text-anchor="middle">⚡ C++ (DSA)</text>
      </g>
      <!-- Python -->
      <g transform="translate(130, 0)">
        <rect width="120" height="30" rx="8" fill="#132342" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
        <text class="skill-pill" x="60" y="19" text-anchor="middle">🐍 Python 3</text>
      </g>
      <!-- C -->
      <g transform="translate(260, 0)">
        <rect width="90" height="30" rx="8" fill="#132342" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
        <text class="skill-pill" x="45" y="19" text-anchor="middle">⚙️ C Lang</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(360, 0)">
        <rect width="115" height="30" rx="8" fill="#132342" stroke="#FACC15" stroke-opacity="0.4" stroke-width="1"/>
        <text class="skill-pill" x="57" y="19" text-anchor="middle">🌐 JavaScript</text>
      </g>
    </g>
  </g>

  <!-- Row 2: Frontend & Web Technologies -->
  <g transform="translate(36, 112)">
    <text class="cat-label" x="0" y="20">FRONTEND &amp; WEB</text>
    
    <g transform="translate(160, 0)">
      <!-- HTML5 -->
      <g transform="translate(0, 0)">
        <rect width="100" height="30" rx="8" fill="#132342" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
        <text class="skill-pill" x="50" y="19" text-anchor="middle">📄 HTML5</text>
      </g>
      <!-- CSS3 -->
      <g transform="translate(110, 0)">
        <rect width="95" height="30" rx="8" fill="#132342" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1"/>
        <text class="skill-pill" x="47" y="19" text-anchor="middle">🎨 CSS3</text>
      </g>
      <!-- Responsive UI -->
      <g transform="translate(215, 0)">
        <rect width="145" height="30" rx="8" fill="#132342" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
        <text class="skill-pill" x="72" y="19" text-anchor="middle">📱 Responsive UI</text>
      </g>
      <!-- DOM & APIs -->
      <g transform="translate(370, 0)">
        <rect width="140" height="30" rx="8" fill="#132342" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
        <text class="skill-pill" x="70" y="19" text-anchor="middle">🔌 REST &amp; DOM</text>
      </g>
    </g>
  </g>

  <!-- Row 3: Tools & Specializations -->
  <g transform="translate(36, 162)">
    <text class="cat-label" x="0" y="20">TOOLS &amp; DOMAINS</text>
    
    <g transform="translate(160, 0)">
      <!-- AI/ML -->
      <g transform="translate(0, 0)">
        <rect width="140" height="30" rx="8" fill="#132342" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
        <text class="skill-pill" x="70" y="19" text-anchor="middle">🤖 AI/ML Foundations</text>
      </g>
      <!-- Git & GitHub -->
      <g transform="translate(150, 0)">
        <rect width="130" height="30" rx="8" fill="#132342" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
        <text class="skill-pill" x="65" y="19" text-anchor="middle">🐙 Git &amp; GitHub</text>
      </g>
      <!-- AWS -->
      <g transform="translate(290, 0)">
        <rect width="90" height="30" rx="8" fill="#132342" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
        <text class="skill-pill" x="45" y="19" text-anchor="middle">☁️ AWS</text>
      </g>
      <!-- Canva -->
      <g transform="translate(390, 0)">
        <rect width="100" height="30" rx="8" fill="#132342" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
        <text class="skill-pill" x="50" y="19" text-anchor="middle">✨ Canva</text>
      </g>
    </g>
  </g>
</svg>