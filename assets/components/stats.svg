<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 240" width="410" height="240" fill="none">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1124"/>
      <stop offset="50%" stop-color="#0E1B38"/>
      <stop offset="100%" stop-color="#080E1C"/>
    </linearGradient>
    <linearGradient id="statEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="statBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    .card-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #34D399;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .stat-label {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #94A3B8;
    }
    .stat-val {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 22px;
      font-weight: 800;
      fill: #FFFFFF;
    }
    .stat-sub {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #64748B;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="406" height="236" rx="14" fill="url(#statsBg)" stroke="url(#statBorder)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(24, 28)">
    <circle cx="8" cy="8" r="8" fill="#10B981" fill-opacity="0.2"/>
    <path d="M 8 4 L 8 12 M 4 8 L 12 8" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <text class="card-title" x="24" y="12">GITHUB METRICS &amp; STATS</text>
  </g>

  <!-- Stat Grid: 2x2 Layout -->
  <!-- Top Left: Public Repos -->
  <g transform="translate(24, 62)">
    <rect width="174" height="68" rx="10" fill="#111F3B" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    <text class="stat-label" x="16" y="24">PUBLIC REPOSITORIES</text>
    <text class="stat-val" x="16" y="52">2</text>
    <circle cx="145" cy="38" r="14" fill="#10B981" fill-opacity="0.15"/>
    <path d="M 140 38 L 144 42 L 151 34" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top Right: Stars Earned -->
  <g transform="translate(212, 62)">
    <rect width="174" height="68" rx="10" fill="#111F3B" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1"/>
    <text class="stat-label" x="16" y="24">STARS EARNED</text>
    <text class="stat-val" x="16" y="52">2 ★</text>
    <circle cx="145" cy="38" r="14" fill="#06B6D4" fill-opacity="0.15"/>
    <polygon points="145,30 148,36 154,37 149,41 151,47 145,43 139,47 141,41 136,37 142,36" fill="#06B6D4"/>
  </g>

  <!-- Bottom Left: Network -->
  <g transform="translate(24, 142)">
    <rect width="174" height="68" rx="10" fill="#111F3B" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    <text class="stat-label" x="16" y="24">COMMUNITY NETWORK</text>
    <text class="stat-val" x="16" y="52">0 <tspan font-size="13" font-weight="500" fill="#94A3B8">/ 2 following</tspan></text>
  </g>

  <!-- Bottom Right: Engineering Focus -->
  <g transform="translate(212, 142)">
    <rect width="174" height="68" rx="10" fill="#111F3B" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    <text class="stat-label" x="16" y="24">CURRENT FOCUS</text>
    <text class="stat-val" x="16" y="50" font-size="16" fill="url(#statEmerald)">AI/ML &amp; Web</text>
    <text class="stat-sub" x="16" y="62">Active Growth</text>
  </g>
</svg>